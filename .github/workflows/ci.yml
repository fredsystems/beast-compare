name: CI

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  flake-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Determinate Nix
        uses: DeterminateSystems/determinate-nix-action@4d65ea9cab522b6d9f29a170aed23ededc1b27af # v3

      - name: Use Determinate Cache
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-flakehub: false
          use-gha-cache: false

      # pre-commit hooks, pytest (the package's check phase) and mypy --strict.
      - name: nix flake check
        run: nix flake check -L

      - name: Check links (online)
        # `nix flake check` runs the pre-commit hooks in the Nix sandbox,
        # which has no network, so its lychee hook only checks local file
        # links. Run the same pinned checker and shared config outside the
        # sandbox so remote links are checked too.
        env:
          # Lets lychee use the GitHub API for github.com links instead of
          # being rate limited.
          GITHUB_TOKEN: ${{ github.token }}
        run: git ls-files -z '*.md' '*.mdx' | xargs -0 -r nix run --inputs-from . precommit-base#link-check --
